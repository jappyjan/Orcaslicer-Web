name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on the TypeScript side. Runs without Docker.
  static:
    name: format / lint / typecheck / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # The real thing: build the image with the pinned OrcaSlicer and slice something.
  # Hard constraint #2 — the golden --help diff is what catches a CLI-surface change
  # sneaking in on a version bump, so it runs before the slice and is not allowed to
  # be skipped.
  container:
    name: image / cli drift / smoke slice
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Report image size
        run: docker image ls orcaslicer-web:dev

      - name: CLI surface drift check
        run: docker compose run --rm help-check

      - name: Smoke slice (headless, no display server)
        run: docker compose run --rm smoke

      # `docker compose run --rm integration` bind-mounts this checkout into the image
      # and runs `npx vitest` inside it. The image is installed with `npm ci --omit=dev`
      # and carries no test runner on purpose, so — as the compose file says — vitest and
      # the TypeScript sources come from the *mount*. `npx` fetches the vitest binary but
      # Vite loads the config by writing a temp module next to it in `/repo`, and Node
      # resolves that module's imports from `/repo/node_modules`. Without this step there
      # is no `/repo/node_modules` and the config fails to load before a single test is
      # selected — which is what "Cannot find package 'vitest'" in this job was, twice.
      #
      # It runs after the image build so the install never enters the build context
      # (`.dockerignore` excludes node_modules, but a 300 MB directory is still worth not
      # creating before a `COPY . .`).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the runner-side dependencies the mounted repo needs
        run: npm ci --no-audit --no-fund

      # `@orca-web/shared`, `@orca-web/catalog` and `@orca-web/gcode` publish `dist/`
      # rather than source, and the integration tests import all three. On a developer's
      # machine `npm run check` has already emitted them; a fresh runner has not.
      - name: Build the workspace packages the tests import
        run: npx tsc --build tsconfig.json

      # The M1 acceptance criterion, and the working agreement's "the CI suite must
      # include at least one real slice": three concurrent slices through the HTTP API,
      # progress streamed for each, and /work empty afterwards. The engine is not
      # mocked here.
      - name: Slice service acceptance (three concurrent real slices)
        run: docker compose run --rm integration

      - name: Assert /work is not accumulating between runs
        run: docker compose run --rm --entrypoint sh integration -c 'ls -A /work | wc -l | grep -qx 0'

      - name: Assert no display server was involved
        # Belt and braces: the runner must not have had an X server for the slice to
        # have proven anything. The smoke script asserts this too.
        run: |
          if [ -n "${DISPLAY:-}" ]; then
            echo "::error::DISPLAY is set on the runner; the headless assertion is meaningless"
            exit 1
          fi
          echo "no DISPLAY on the runner"
